name: music
icon: null
icon_initials: 🎵
processes:
  🌐 Vibes Page:
    command: php -S 127.0.0.1:8000 -t docs
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  🧪 Tests:
    command: composer test
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  🔌 Request Server:
    command: php spotify serve --port=9876
    working_dir: null
    auto_start: false
    auto_restart: true
    restart_when_changed: []
    env: {}
  📡 Now Playing:
    command: php spotify watch --json --interval=5
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed:
    - app/Commands/WatchCommand.php
    - app/Services/SpotifyPlayerService.php
    env: {}
  ✨ Quality:
    command: composer quality
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  🎵 Player:
    command: php spotify player
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed:
    - app/Commands/PlayerCommand.php
    env: {}
  💎 Premium Player:
    command: php spotify player:premium
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed:
    - app/Commands/PremiumPlayerCommand.php
    - app/Player/PlayerRenderer.php
    - app/Player/PlayerTheme.php
    - app/Player/PlayerViewModel.php
    env: {}
  🟢 Daemon:
    command: sh -c 'php spotify daemon start; while true; do php spotify daemon health --heal --json; sleep 30; done'
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  💗 Pulse:
    command: ./spotify pulse
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
